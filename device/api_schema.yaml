          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeviceInfo'
    PaginatedEventLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventLog'
    PaginatedNotificationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedSessionListResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/SessionListResponse'
    PatchedDeviceInfo:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          readOnly: true
        device_type:
          $ref: '#/components/schemas/DeviceInfoDeviceTypeEnum'
        ip_address:
          type: string
          nullable: true
        node_id:
          type: string
          maxLength: 100
        node_name:
          type: string
          maxLength: 255
        heartbeat_status:
          $ref: '#/components/schemas/HeartbeatStatusEnum'
        network_status:
          $ref: '#/components/schemas/NetworkStatusEnum'
        telemetry_timestamp:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      type: string
      description: |-
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `CRITICAL` - Critical
    RoleEnum:
      enum:
      - SUPER_ADMIN
      - COMMAND_OPERATOR
      - FIELD_OPERATOR
      type: string
      description: |-
        * `SUPER_ADMIN` - Super Admin
        * `COMMAND_OPERATOR` - Command Operator
        * `FIELD_OPERATOR` - Field Operator
    RoleTokenObtainPair:
      type: object
      description: Login serializer matching doc §13.1 response shape.
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    SatelliteTelemetryV1:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session_id:
          type: string
          format: uuid
          writeOnly: true
        timestamp:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        satellite_id:
          type: string
          maxLength: 100
        satellite_name:
          type: string
          maxLength: 255
        downlink_frequency_ghz:
          type: number
          format: double
          nullable: true
        uplink_frequency_ghz:
          type: number
          format: double
          nullable: true
        snr:
          type: number
          format: double
          nullable: true
        modulation:
          type: string
          maxLength: 100
        protocol:
          type: string
          maxLength: 100
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
      required:
      - created_at
      - id
      - satellite_id
    SessionDetailResponse:
      type: object
      properties:
        status:
          type: string
          default: SUCCESS
        message:
          type: string
        data:
          $ref: '#/components/schemas/TelemetrySession'
      required:
      - message
    SessionListResponse:
      type: object
      properties:
        status:
          type: string
          default: SUCCESS
        count:
          type: integer
        total_pages:
          type: integer
        current_page:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/TelemetrySession'
      required:
      - count
      - current_page
      - results
      - total_pages
    SeverityEnum:
      enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      - INFORMATIONAL
      type: string
      description: |-
        * `CRITICAL` - Critical
        * `HIGH` - High
        * `MEDIUM` - Medium
        * `LOW` - Low
        * `INFORMATIONAL` - Informational
    StatusEnum:
      enum:
      - CREATED
      - RUNNING
      - STOPPED
      type: string
      description: |-
        * `CREATED` - Created
        * `RUNNING` - Running
        * `STOPPED` - Stopped
    StopSession:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        stop_reason:
          type: string
          default: ''
          maxLength: 255
      required:
      - session_id
    SyncStart:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        subsystem_type:
          oneOf:
          - $ref: '#/components/schemas/SyncStartSubsystemTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        device_reference_id:
          type: string
          default: ''
        polling_interval:
          type: integer
          default: 10
        destination_ip:
          type: string
          nullable: true
      required:
      - session_id
    SyncStartSubsystemTypeEnum:
      enum:
      - DF
      - MONITORING
      - DRONE
      - SATELLITE
      - PASSIVE_CELLULAR
      - ACTIVE_CELLULAR
      type: string
      description: |-
        * `DF` - DF
        * `MONITORING` - MONITORING
        * `DRONE` - DRONE
        * `SATELLITE` - SATELLITE
        * `PASSIVE_CELLULAR` - PASSIVE_CELLULAR
        * `ACTIVE_CELLULAR` - ACTIVE_CELLULAR
    SyncStatusDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session_id:
          type: string
          format: uuid
          readOnly: true
        subsystem_type:
          type: string
          maxLength: 100
        device_reference_id:
          type: string
          description: node_id / drone_id / satellite_id / passive_cellular_id / active_cellular_id
          maxLength: 100
        node_id:
          type: string
          maxLength: 100
        sync_status:
          $ref: '#/components/schemas/SyncStatusEnum'
        retry_count:
          type: integer
        polling_interval:
          type: integer
          description: Polling interval (seconds)
        last_sync_timestamp:
          type: string
          format: date-time
          nullable: true
        last_retry_timestamp:
          type: string
          format: date-time
          nullable: true
        last_failure_timestamp:
          type: string
          format: date-time
          nullable: true
        last_error_message:
          type: string
        exported_records:
          type: integer
        csv_file_name:
          type: string
          maxLength: 500
        destination_ip:
          type: string
          nullable: true
        transfer_status:
          type: string
          maxLength: 50
        remarks:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - session_id
      - updated_at
    SyncStatusEnum:
      enum:
      - PENDING
      - IN_PROGRESS
      - COMPLETED
      - FAILED
      - PENDING_RETRY
      - RETRYING
      - FAILED_MAX_RETRIES
      - SENT_ON_RETRY
      - SUCCESS
      type: string
      description: |-
        * `PENDING` - Pending
        * `IN_PROGRESS` - In Progress
        * `COMPLETED` - Completed
        * `FAILED` - Failed
        * `PENDING_RETRY` - Pending Retry
        * `RETRYING` - Retrying
        * `FAILED_MAX_RETRIES` - Failed (Max Retries)
        * `SENT_ON_RETRY` - Sent On Retry
        * `SUCCESS` - Success
    TelemetrySession:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          readOnly: true
        session_name:
          type: string
          maxLength: 255
        operation_mode:
          type: string
          maxLength: 50
        cyronics_ip:
          type: string
          nullable: true
        cognizant_ip:
          type: string
          nullable: true
        monitoring_system_ip:
          type: string
          nullable: true
        df_system_ip:
          type: string
          nullable: true
        drone_detector_ip:
          type: string
          nullable: true
        cellular_active_ip:
          type: string
          nullable: true
        cellular_passive_ip:
          type: string
          nullable: true
        satellite_interception_ip:
          type: string
          nullable: true
        session_type:
          type: string
          maxLength: 50
        node_id:
          type: string
          maxLength: 100
        node_lat:
          type: number
          format: double
          nullable: true
        node_long:
          type: number
          format: double
          nullable: true
        remarks:
          type: string
        export_status:
          type: string
          maxLength: 50
        polling_interval:
          type: integer
          description: Polling interval in seconds
        status:
          $ref: '#/components/schemas/StatusEnum'
        start_time:
          type: string
          nullable: true
          readOnly: true
        stop_time:
          type: string
          nullable: true
          readOnly: true
        stop_reason:
          type: string
          maxLength: 255
        last_sync_time:
          type: string
          nullable: true
          readOnly: true
        created_by:
          type: string
          maxLength: 150
      required:
      - last_sync_time
      - session_id
      - session_name
      - start_time
      - stop_time
    TelemetryTopologyIngest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        device_type:
          allOf:
          - $ref: '#/components/schemas/TelemetryTopologyIngestDeviceTypeEnum'
          default: NODE
        source_ip:
          type: string
          nullable: true
        master:
          type: object
          additionalProperties: {}
        nodes:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - master
    TelemetryTopologyIngestDeviceTypeEnum:
      enum:
      - NODE
      - DRONE
      - DF
      - MONITORING
      - SATELLITE
      - PASSIVE_CELL
      - ACTIVE_CELL
      type: string
      description: |-
        * `NODE` - NODE
        * `DRONE` - DRONE
        * `DF` - DF
        * `MONITORING` - MONITORING
        * `SATELLITE` - SATELLITE
        * `PASSIVE_CELL` - PASSIVE_CELL
        * `ACTIVE_CELL` - ACTIVE_CELL
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          description: |-
            User role determining access permissions

            * `SUPER_ADMIN` - Super Admin
            * `COMMAND_OPERATOR` - Command Operator
            * `FIELD_OPERATOR` - Field Operator
        assigned_node_id:
          type: string
          description: Optional node binding for FIELD_OPERATOR role
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - role
      - updated_at
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
