[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "migrations",
    "staticfiles",
    "cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in argument defaults (Django pattern)
    "DJ001",  # CharField null=False default is okay
    "DJ008",  # missing __str__ on models (optional)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"core/settings.py" = ["E501", "F401"]
