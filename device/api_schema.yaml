openapi: 3.0.3
info:
  title: Himshravan V1 EWCPS API
  version: 1.0.0
  description: |-
    API documentation for **Himshravan V1 — Electronic Warfare Command Post System (EWCPS)**.

    Covers Authentication, Session Management, Device Discovery (device_info), the six telemetry subsystems (Direction Finding, Monitoring, Drone Detection, Cellular Active, Cellular Passive, Satellite Interception), Synchronization status & retry tracking, Event/Threat log with acknowledgement, Reports, and CSV Export.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Login Returns JWT access/refresh tokens, role, and expiry.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleTokenObtainPair'
            examples:
              Example:
                value:
                  username: admin
                  password: Admin@123
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleTokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Logout Blacklists the supplied refresh token.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Get the currently authenticated user's profile.
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Refresh JWT access token using a valid refresh token.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/device/register/:
    post:
      operationId: device_register_create
      description: Register a new device.
      tags:
      - Device
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInfo'
            examples:
              ExampleRequest:
                value:
                  device_type: NODE
                  ip_address: 192.168.1.100
                  node_id: node-001
                  node_name: Alpha Node
                  heartbeat_status: ACTIVE
                  network_status: ONLINE
                summary: Example Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceInfo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceInfo'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
          description: ''
  /api/device/status/{node_id}/:
    get:
      operationId: device_status_retrieve
      description: Get device status by node_id (doc §15.2).
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
        required: true
      tags:
      - Device
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
          description: ''
  /api/devices/:
    get:
      operationId: devices_list
      description: List all registered devices with optional filtering.
      parameters:
      - in: query
        name: device_type
        schema:
          type: string
        description: Filter by device type (NODE, DRONE, SATELLITE, PASSIVE_CELL,
          ACTIVE_CELL)
      - in: query
        name: heartbeat_status
        schema:
          type: string
        description: Filter by heartbeat status (ACTIVE, INACTIVE)
      - in: query
        name: network_status
        schema:
          type: string
        description: Filter by network status (ONLINE, OFFLINE)
      - in: query
        name: node_id
        schema:
          type: string
        description: Filter by node identifier
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search in node_name, node_id
      tags:
      - Device
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceInfoList'
          description: ''
  /api/devices/{device_id}/:
    get:
      operationId: devices_retrieve
      description: Retrieve a single device by its UUID.
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: device_id
        schema:
          type: string
        description: UUID of the device
        required: true
      tags:
      - Device
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
          description: ''
  /api/devices/{device_id}/delete/:
    delete:
      operationId: devices_delete_destroy
      description: Delete a device by its UUID.
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: device_id
        schema:
          type: string
        description: UUID of the device
        required: true
      tags:
      - Device
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
          description: ''
  /api/devices/{device_id}/update/:
    put:
      operationId: devices_update_update
      description: Update an existing device.
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: device_id
        schema:
          type: string
        description: UUID of the device
        required: true
      tags:
      - Device
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInfo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceInfo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceInfo'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
          description: ''
    patch:
      operationId: devices_update_partial_update
      description: Update an existing device.
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: device_id
        schema:
          type: string
        description: UUID of the device
        required: true
      tags:
      - Device
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDeviceInfo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDeviceInfo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDeviceInfo'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
          description: ''
  /api/events/:
    get:
      operationId: events_list
      description: List events with optional filters (doc §21.5).
      parameters:
      - in: query
        name: acknowledged
        schema:
          type: string
        description: true/false
      - in: query
        name: event_type
        schema:
          type: string
        description: Specific event type
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: session_id
        schema:
          type: string
        description: Filter by session UUID
      - in: query
        name: severity
        schema:
          type: string
        description: CRITICAL/HIGH/MEDIUM/LOW/INFORMATIONAL
      - in: query
        name: subsystem_type
        schema:
          type: string
        description: DF/MONITORING/DRONE/SATELLITE/...
      tags:
      - events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventLogList'
          description: ''
  /api/events/acknowledge/:
    post:
      operationId: events_acknowledge_create
      description: Acknowledge an event (doc §21.6).
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeEvent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcknowledgeEvent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcknowledgeEvent'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLog'
          description: ''
  /api/export/csv/:
    post:
      operationId: export_csv_create
      description: CSV Export (doc §18.2). Writes a CSV under EXPORTS_DIR and updates
        sync_status.
      tags:
      - export
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              Example:
                value:
                  session_id: e9bcfae2-4489-44a8-b53d-11aa22bb33cc
                  module: DRONE
                  selected_fields:
                  - drone_id
                  - drone_status
                  - drone_latitude
                  - drone_longitude
                  destination_ip: 192.168.20.10
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/heartbeat/check/:
    post:
      operationId: heartbeat_check_create
      description: Check heartbeat of a node by IP address.
      tags:
      - heartbeat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Heartbeat'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/notifications/:
    get:
      operationId: notifications_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/notifications/{notification_id}/:
    get:
      operationId: notifications_retrieve
      description: Retrieve a single notification by its UUID.
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: notification_id
        schema:
          type: string
        description: UUID of the notification
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/{notification_id}/read/:
    post:
      operationId: notifications_read_create
      description: Mark a notification as read.
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: notification_id
        schema:
          type: string
        description: UUID of the notification
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/mark-all-read/:
    post:
      operationId: notifications_mark_all_read_create
      description: Mark all notifications as read. Optionally filter by category.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter by category
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/reports/analysis/:
    get:
      operationId: reports_analysis_retrieve
      description: Analytical report — aggregates such as min/max/avg signal_strength
        or snr (doc §11).
      parameters:
      - in: query
        name: module
        schema:
          type: string
        description: DF/MONITORING/DRONE/CELLULAR_ACTIVE/CELLULAR_PASSIVE/SATELLITE
      - in: query
        name: session_id
        schema:
          type: string
        description: Filter by session UUID
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/reports/statistical/:
    get:
      operationId: reports_statistical_retrieve
      description: Statistical report — counts per subsystem (doc §11).
      parameters:
      - in: query
        name: session_id
        schema:
          type: string
        description: Filter by session UUID
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/session/{session_id}/:
    get:
      operationId: session_retrieve
      description: Retrieve a single session by its UUID.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: session_id
        schema:
          type: string
        description: UUID of the session
        required: true
      tags:
      - Session
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
          description: ''
  /api/session/create/:
    post:
      operationId: session_create_create
      description: Create a new telemetry session.
      tags:
      - Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionDocsRequest'
            examples:
              ExampleRequest:
                value:
                  session_name: test_lf
                  operation_mode: LF
                  node_id: '9'
                  node_lat: 18.506145
                  node_long: 73.856589
                summary: Example Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateSessionDocsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSessionDocsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
          description: ''
  /api/session/status/:
    get:
      operationId: session_status_retrieve
      description: Get the latest active session, or a specific session if session_id
        is provided (doc §11).
      parameters:
      - in: query
        name: session_id
        schema:
          type: string
        description: Optional UUID of a specific session
      tags:
      - Session
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
          description: ''
  /api/session/stop/:
    post:
      operationId: session_stop_create
      description: Stop an active telemetry session.
      tags:
      - Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StopSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StopSession'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
          description: ''
  /api/sessions/:
    get:
      operationId: sessions_list
      description: List telemetry sessions with optional filtering.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: Filter by start time from (ISO 8601 datetime)
      - in: query
        name: date_to
        schema:
          type: string
        description: Filter by start time to (ISO 8601 datetime)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search in session_name, remarks, cyronics_ip, cognizant_ip, session_type
      - in: query
        name: session_id
        schema:
          type: string
        description: UUID of the session
      - in: query
        name: status
        schema:
          type: string
        description: Filter by session status (e.g., RUNNING, STOPPED, CREATED)
      tags:
      - Session
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionListResponseList'
          description: ''
  /api/sessions/{session_id}/delete/:
    delete:
      operationId: sessions_delete_destroy
      description: Delete a session by its UUID.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: session_id
        schema:
          type: string
        description: UUID of the session
        required: true
      tags:
      - Session
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
          description: ''
  /api/sync/start/:
    post:
      operationId: sync_start_create
      description: Start synchronization for a (session, subsystem, device) triple
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncStart'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusDetail'
          description: ''
  /api/sync/status/:
    get:
      operationId: sync_status_list
      description: Generic sync status — list latest per (subsystem, device).
      parameters:
      - in: query
        name: session_id
        schema:
          type: string
        description: Filter by session UUID
      - in: query
        name: subsystem_type
        schema:
          type: string
        description: DF/MONITORING/DRONE/...
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncStatusDetail'
          description: ''
  /api/sync/status/active-cellular/{active_cellular_id}/:
    get:
      operationId: sync_status_active_cellular_retrieve
      description: Get sync status by active_cellular_id.
      parameters:
      - in: path
        name: active_cellular_id
        schema:
          type: string
        required: true
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusDetail'
          description: ''
  /api/sync/status/drone/{drone_id}/:
    get:
      operationId: sync_status_drone_retrieve
      description: Get sync status by drone_id.
      parameters:
      - in: path
        name: drone_id
        schema:
          type: string
        required: true
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusDetail'
          description: ''
  /api/sync/status/node/{node_id}/:
    get:
      operationId: sync_status_node_retrieve
      description: Get sync status by node_id.
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
        required: true
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusDetail'
          description: ''
  /api/sync/status/passive-cellular/{passive_cellular_id}/:
    get:
      operationId: sync_status_passive_cellular_retrieve
      description: Get sync status by passive_cellular_id.
      parameters:
      - in: path
        name: passive_cellular_id
        schema:
          type: string
        required: true
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusDetail'
          description: ''
  /api/sync/status/satellite/{satellite_id}/:
    get:
      operationId: sync_status_satellite_retrieve
      description: Get sync status by satellite_id.
      parameters:
      - in: path
        name: satellite_id
        schema:
          type: string
        required: true
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusDetail'
          description: ''
  /api/telemetry/cellular-active/:
    post:
      operationId: telemetry_cellular_active_create
      description: Store Cellular Active telemetry sample (doc §16.7).
      tags:
      - telemetry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellularActiveTelemetryV1'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CellularActiveTelemetryV1'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CellularActiveTelemetryV1'
        required: true
